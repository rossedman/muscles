# The muscles site: the landing page (overrides/home.html) and every page in
# docs/. Published to GitHub Pages by .github/workflows/pages.yml.
# Preview locally: pip install -r docs/requirements.txt && mkdocs serve
site_name: muscles
site_description: Explain container images, layer by layer. Find the waste. Gate it in CI.
site_url: https://rossedman.io/muscles/
repo_url: https://github.com/rossedman/muscles
repo_name: rossedman/muscles
edit_uri: edit/main/docs/

# Strict builds (CI) fail on broken links and #anchors between pages.
validation:
  links:
    anchors: warn

exclude_docs: |
  /assets/src/
  /assets/render.py
  /assets/termshot.py
  /requirements.txt

nav:
  - Home: index.md
  - Get started: getting-started.md
  - Guides:
      - Reading layers: layers.md
      - Finding waste: waste.md
      - Comparing images: diff.md
      - CI: ci.md
      - Checks and budgets: checks.md
      - How it works: how-it-works.md
  - Reference:
      - CLI: cli.md
      - Configuration: configuration.md
      - Output formats: output.md
      - Troubleshooting: troubleshooting.md
  - Project:
      - Design: design.md
      - Specification: SPEC.md
      - Contributing: contributing.md
      - Releasing: releasing.md

theme:
  name: material
  custom_dir: overrides
  logo: assets/site/logo.svg
  favicon: assets/site/logo.svg
  palette:
    scheme: slate
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil-outline
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/site/landing.css
  - assets/site/docs.css
extra_javascript:
  - assets/site/landing.js
  - assets/site/docs.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rossedman/muscles
  generator: false
