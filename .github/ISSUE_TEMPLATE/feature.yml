name: Feature request
description: An idea for muscles
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to find out about an image, and why it's hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: The command and output you'd want, if you have one in mind.
