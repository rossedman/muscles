# Weekly updates for Go modules, GitHub Actions and the docs site's Python
# packages, each grouped in one pull request so CI runs once for them.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: "Update Go modules:"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Update Actions:"

  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    # MkDocs 2.0 drops theme overrides (overrides/home.html): stay on 1.x.
    ignore:
      - dependency-name: mkdocs
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Update docs packages:"
