name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt
      - name: vet
        run: make vet
      - name: test (race)
        run: go test -race ./...
      - name: coverage (90% or more)
        run: make cover
      - name: one command per file
        run: ./tools/check-cmds.sh
      - name: doc comments
        run: go run ./tools/doccheck ./...
      - name: benchmarks run
        run: make bench-smoke

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        run: make vuln

  # Each fuzz target for 30s, so a parser that panics on odd input fails
  # the pull request instead of a user's CI.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: fuzz
        run: make fuzz FUZZTIME=30s

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Download modules first, with retries: if a download from the module
      # proxy is cut off, golangci-lint reports it as a typecheck error.
      - name: download modules
        run: for i in 1 2 3; do go mod download && exit 0; sleep $((i * 5)); done; exit 1
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  # muscles checking an image of itself: the release Dockerfile, built to a
  # tarball, against the budgets in .muscles.yaml.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build muscles and its image
        run: |
          make build
          mkdir -p linux/amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o linux/amd64/muscles ./cmd/muscles
          docker build --platform linux/amd64 -t muscles:ci .
          docker save muscles:ci -o muscles.tar
      - name: Explain it
        run: |
          ./muscles layers list muscles:ci          # from the Docker daemon
          ./muscles layers list muscles.tar -o markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Check it
        run: ./muscles images check muscles.tar
      # The action from this checkout, with the muscles just built.
      - run: echo "$PWD" >> "$GITHUB_PATH"
      - uses: ./
        with:
          image: muscles.tar
          dockerfile: Dockerfile
          install: "false"
          comment: "false"

  # The action as users run it: installing the latest release.
  action:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: muscles
        with:
          image: alpine:3.20
          baseline: alpine:3.19
          check: "false"
          comment: "false"
      - name: Outputs are set
        env:
          SIZE: ${{ steps.muscles.outputs.size }}
          REPORT: ${{ steps.muscles.outputs.report }}
        run: test "$SIZE" -gt 0 && test -s "$REPORT"

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
