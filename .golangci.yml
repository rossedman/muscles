# golangci-lint v2. CI runs it (.github/workflows/ci.yml); locally:
# golangci-lint run ./...
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - misspell
    - unconvert
  settings:
    errcheck:
      # Writes to the terminal: a failed write there has no useful recovery.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Writer).Write
        - io.WriteString
        - os.Remove
        - os.MkdirAll
        - os.WriteFile
        - os.Mkdir
  exclusions:
    rules:
      # Tests set up fixtures without checking every error.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
